<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="topbar_bar">
                <input type="text" placeholder="Search...">
            </div>
            <div class="topbar_actions">
                <button class="btn">Add bookmark</button>
                <img src="./assets/avatar.png" class="avatar" alt="avatar">
            </div>
        </header>
        <main class="main">

            <ul class="bookmarks">
                <li>
                    <article class="bookmark>
                        <div class="bookmark_header">
                            <img src="./assets/1.png" alt="bookmark image">
                            <div class="bookmark_title">Bookmark title</div>
                        </div>
                        <button class="bookmark_action">Delete</button>
                    </article>
                </li>
            </ul>

        </main>
        <aside class="sidebar"></aside>
    </div>
</body>
</html>
